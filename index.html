<!DOCTYPE html>
<!-- lang="fr" : indique la langue de la page (utile pour les lecteurs d'écran et le SEO) -->
<html lang="fr">
<head>
  <!-- charset="UTF-8" : permet d'afficher correctement les accents (é, è, ç...) -->
  <meta charset="UTF-8">
  <!-- viewport : indispensable pour que la page s'affiche correctement sur mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirCargo Quote — Cotation de fret aérien</title>
  <!--
    On charge le CSS dans le <head> (contrairement au JS qu'on met en bas).
    Pourquoi l'inverse : on veut que le style soit connu AVANT que la page
    s'affiche, sinon l'utilisateur verrait brièvement la page toute nue.
  -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>AirCargo Quote</h1>
    <p>Outil de cotation de fret aérien</p>
  </header>

  <main>

    <!-- ===== SECTION 1 : LE FORMULAIRE ===== -->
    <section class="carte">
      <h2>Nouvelle cotation</h2>

      <!--
        <form> : regroupe les champs de saisie.
        L'attribut id nous permettra de le retrouver depuis le JavaScript.
        On utilise un vrai <form> (et pas juste des <input> en vrac) pour deux raisons :
        - la validation automatique du navigateur (attribut "required")
        - la touche Entrée qui valide le formulaire, gratuitement
      -->
      <form id="formulaire-cotation">

        <!--
          <label for="..."> associé à un <input id="..."> :
          cliquer sur le texte du label place le curseur dans le champ.
          C'est une règle d'accessibilité de base, et c'est gratuit.
        -->
        <div class="champ">
          <label for="depart">Aéroport de départ</label>
          <select id="depart" name="depart" required>
            <!-- Les <option> sont générées par script.js -->
          </select>
        </div>

        <div class="champ">
          <label for="arrivee">Aéroport d'arrivée</label>
          <select id="arrivee" name="arrivee" required>
            <!-- Les <option> sont générées par script.js -->
          </select>
        </div>

        <div class="champ">
          <label for="poids">Poids brut (kg)</label>
          <!--
            type="number" : le navigateur n'accepte que des chiffres.
            min / step : bornes de saisie vérifiées par le navigateur.
            required : le formulaire ne peut pas être envoyé si le champ est vide.
          -->
          <input type="number" id="poids" name="poids" min="1" step="1" value="250" required>
        </div>

        <div class="champ">
          <label for="volume">Volume (m³)</label>
          <input type="number" id="volume" name="volume" min="0.1" step="0.1" value="2" required>
        </div>

        <div class="champ">
          <label for="type">Type de marchandise</label>
          <select id="type" name="type" required>
            <!-- Les <option> sont générées par script.js -->
          </select>
        </div>

        <div class="champ">
          <label for="date">Date d'expédition souhaitée</label>
          <input type="date" id="date" name="date" required>
        </div>

        <!--
          type="submit" : ce bouton déclenche l'envoi du formulaire.
          C'est cet évènement "submit" que le JavaScript va intercepter.
          Le libellé dit ce qui va se passer, pas "Envoyer".
        -->
        <button type="submit">Calculer la cotation</button>
      </form>
    </section>

    <!--
      La colonne de droite regroupe tout ce que le JavaScript produit :
      les erreurs, la cotation en cours, et l'historique.
      Sans ce conteneur, la grille placerait ces blocs n'importe où selon
      qu'ils sont visibles ou masqués — le résultat sauterait d'une colonne
      à l'autre. Un conteneur explicite rend la mise en page prévisible.
    -->
    <div class="colonne-droite">

    <!--
      role="alert" : indique aux lecteurs d'écran que ce message doit être
      annoncé dès qu'il apparaît. L'attribut "hidden" masque l'élément
      tant que le JavaScript ne l'a pas retiré.
    -->
    <p id="message-erreur" role="alert" hidden></p>

    <section id="section-resultat" class="carte" hidden>
      <h2>Détail de la cotation</h2>

      <!-- Ligne de résumé : trajet, distance, poids retenu -->
      <p id="resume-trajet"></p>
      <p id="resume-poids"></p>

      <!--
        Un <table> est ici sémantiquement juste : on affiche bien des données
        tabulaires (des lignes de facturation), pas une mise en page.
        Utiliser un tableau pour positionner des éléments serait une faute ;
        l'utiliser pour des données comme ici est le bon usage.
      -->
      <table>
        <!-- <thead> : les en-têtes de colonnes -->
        <thead>
          <tr>
            <th scope="col">Poste</th>
            <th scope="col">Base de calcul</th>
            <th scope="col">Montant</th>
          </tr>
        </thead>

        <!-- <tbody> vide : c'est le JavaScript qui créera les lignes -->
        <tbody id="corps-detail"></tbody>

        <!-- <tfoot> : le pied du tableau, réservé au total -->
        <tfoot>
          <tr>
            <th scope="row" colspan="2">Total à facturer</th>
            <td id="cellule-total"></td>
          </tr>
        </tfoot>
      </table>

      <!-- ===== L'EXPLICATION PAR L'IA ===== -->
      <div class="bloc-explication">
        <button type="button" id="bouton-expliquer">Expliquer ce prix</button>

        <!--
          aria-live="polite" : prévient les lecteurs d'écran que le contenu
          de cette zone peut changer sans action de l'utilisateur, et qu'il
          faut l'annoncer une fois la lecture en cours terminée.
          Sans ça, une personne aveugle ne saurait jamais que la réponse
          est arrivée.
        -->
        <p id="zone-explication" aria-live="polite" hidden></p>
      </div>
    </section>

    <!-- ===== L'HISTORIQUE ===== -->
    <section id="section-historique" class="carte">

      <div class="entete-historique">
        <h2>Historique</h2>
        <!--
          type="button" : ESSENTIEL. Un <button> placé dans ou près d'un
          formulaire est de type "submit" par défaut et déclencherait
          l'envoi du formulaire. Ici on veut juste exécuter du JavaScript.
        -->
        <button type="button" id="bouton-vider" hidden>Tout supprimer</button>
      </div>

      <!-- Message affiché quand l'historique est vide : un écran vide sans
           explication laisse l'utilisateur se demander si l'outil a bugué. -->
      <p id="historique-vide">Aucune cotation enregistrée pour le moment.</p>

      <!-- <ul> : une liste. Les <li> sont créés par le JavaScript. -->
      <ul id="liste-historique"></ul>
    </section>

    </div><!-- fin .colonne-droite -->

  </main>

  <!--
    On charge le script à la FIN du <body>, juste avant </body>.
    Pourquoi : le navigateur lit la page de haut en bas. Si le script était
    dans le <head>, il s'exécuterait avant que le formulaire existe,
    et ne le trouverait pas.
  -->
  <!--
    L'ORDRE COMPTE. calcul.js définit les fonctions et les tables de données ;
    script.js les utilise. Le navigateur lit la page de haut en bas :
    si l'ordre était inversé, script.js chercherait des fonctions
    qui n'existent pas encore.
  -->
  <script src="calcul.js"></script>
  <script src="script.js"></script>
</body>
</html>
